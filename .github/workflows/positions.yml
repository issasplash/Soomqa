# Reads open positions and balances from configured exchanges/wallets,
# posts a consolidated portfolio summary to Telegram. Cron: every 30 min.
#
# Required secrets (set any subset you want — missing ones are skipped):
#   BYBIT_API_KEY            (Bybit unified read-only key)
#   BYBIT_API_SECRET
#   OKX_API_KEY              (OKX read-only key — works in RU/CIS)
#   OKX_API_SECRET
#   OKX_PASSPHRASE
#   HYPERLIQUID_ADDRESS      (public 0x... address — no key needed)
#   TELEGRAM_BOT_TOKEN       (same as alerts.yml)
#   TELEGRAM_CHAT_ID

name: Portfolio scan

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read positions and post to Telegram
        env:
          # Binance secrets intentionally omitted — blocked in user's region.
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          GATE_API_KEY: ${{ secrets.GATE_API_KEY }}
          GATE_API_SECRET: ${{ secrets.GATE_API_SECRET }}
          HTX_API_KEY: ${{ secrets.HTX_API_KEY }}
          HTX_API_SECRET: ${{ secrets.HTX_API_SECRET }}
          HYPERLIQUID_ADDRESS: ${{ secrets.HYPERLIQUID_ADDRESS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/check-positions.mjs
